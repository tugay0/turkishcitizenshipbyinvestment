# Cloudflare Pages configuration.
#
# Wrangler treats this file as the source of truth and will remove project
# settings that are not declared here on the next deploy. That already cost us
# ANALYTICS_USER once, which made the dashboard reject correct credentials
# while looking like an authentication bug. So anything the Functions need at
# runtime is declared below, per environment.
#
# The password is deliberately NOT here. It is a Pages secret, set with
# `wrangler pages secret put ANALYTICS_PASS`, because this file is committed.

name = "tcbi-reference"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

# The D1 binding is what lets functions/_middleware.js log. Without it the
# middleware silently does nothing and the site still serves, which is the
# intended failure mode: analytics must never be load-bearing.
[[d1_databases]]
binding = "DB"
database_name = "tcbi-analytics"
database_id = "f2b8a641-baf2-45fd-bb81-d25bd2d9d42a"

[vars]
ANALYTICS_USER = "tugay"

[env.preview]
[env.preview.vars]
ANALYTICS_USER = "tugay"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "tcbi-analytics"
database_id = "f2b8a641-baf2-45fd-bb81-d25bd2d9d42a"
